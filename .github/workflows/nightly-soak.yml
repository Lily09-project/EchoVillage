name: Echo Village Nightly Soak

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: echo-village-nightly-soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly-soak:
    name: 90-day simulation soak
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Godot 4.5.2 stable
        shell: pwsh
        env:
          GODOT_VERSION: 4.5.2
          GODOT_TAG: 4.5.2-stable
          GODOT_SHA512: b21115cf3620438e17959d13946bf9c7dceabb6ff71ed32a68996a21e08615edd2d1a3d25641bb3e260d084b31f500231aa59fcf026a5228bcc20ac4e8bade60
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.5.2-win64.zip'
          $install = Join-Path $env:RUNNER_TEMP 'godot-4.5.2-win64'
          $url = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_TAG/Godot_v$env:GODOT_VERSION-stable_win64.exe.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA512).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:GODOT_SHA512) { throw "Godot archive checksum mismatch." }
          if (Test-Path -LiteralPath $install) { Remove-Item -LiteralPath $install -Recurse -Force }
          Expand-Archive -LiteralPath $archive -DestinationPath $install -Force
          $executable = Join-Path $install 'Godot_v4.5.2-stable_win64.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) { throw "Godot executable was not found after extraction: $executable" }
          "GODOT_EXECUTABLE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run nightly acceptance profile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell -NoProfile -ExecutionPolicy Bypass -File quality\run_acceptance.ps1 nightly
          if ($LASTEXITCODE -ne 0) { throw "Nightly acceptance failed with exit code $LASTEXITCODE." }

      - name: Upload nightly evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: echo-village-nightly-soak-${{ github.run_id }}
          path: |
            tests/soak_test_report.json
            reports/acceptance/
          if-no-files-found: warn
          retention-days: 30
