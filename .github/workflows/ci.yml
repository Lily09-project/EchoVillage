name: Echo Village CI

on:
  push:
    branches:
      - master
      - 'codex/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: echo-village-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Echo Village CI
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.5.2 stable
        shell: pwsh
        env:
          GODOT_VERSION: 4.5.2
          GODOT_TAG: 4.5.2-stable
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.5.2-win64.zip'
          $install = Join-Path $env:RUNNER_TEMP 'godot-4.5.2-win64'
          $url = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_TAG/Godot_v$env:GODOT_VERSION-stable_win64.exe.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          if (Test-Path -LiteralPath $install) { Remove-Item -LiteralPath $install -Recurse -Force }
          Expand-Archive -LiteralPath $archive -DestinationPath $install -Force
          $executable = Join-Path $install 'Godot_v4.5.2-stable_win64.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) { throw "Godot executable was not found after extraction: $executable" }
          "GODOT_EXECUTABLE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GODOT_VERSION=$env:GODOT_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache Godot import data
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-${{ runner.os }}-${{ hashFiles('project.godot', 'data/**/*.json', 'scripts/**/*.gd', 'scenes/**/*.tscn') }}

      - name: Run structural and Godot quality gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & cmd.exe /d /c 'run_echo_village.bat --test'
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { throw "Echo Village quality gate failed with exit code $exitCode." }

      - name: Validate generated report
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedPassed = 94
          $reportPath = Join-Path $env:GITHUB_WORKSPACE 'tests\simulation_test_report.json'
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) { throw "Test report was not generated: $reportPath" }
          $report = Get-Content -Raw -Encoding UTF8 -LiteralPath $reportPath | ConvertFrom-Json
          if ([int]$report.failed -ne 0) { throw "The generated report contains $($report.failed) failed tests." }
          if ([int]$report.passed -ne $expectedPassed) { throw "Expected exactly $expectedPassed passing tests, received $($report.passed). Update the release contract intentionally when adding coverage." }
          Write-Output "CI report: passed=$($report.passed) failed=$($report.failed)"

          $securityPath = Join-Path $env:GITHUB_WORKSPACE 'tests\security_audit_report.json'
          if (-not (Test-Path -LiteralPath $securityPath -PathType Leaf)) { throw "Security audit report was not generated: $securityPath" }
          $security = Get-Content -Raw -Encoding UTF8 -LiteralPath $securityPath | ConvertFrom-Json
          if (-not [bool]$security.passed -or [int]$security.finding_count -ne 0) { throw "Security audit reported $($security.finding_count) finding(s)." }
          Write-Output "Security audit: tracked_files=$($security.tracked_files) finding_count=$($security.finding_count)"

      - name: Validate visual QA evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $expected = @(
            'consumer_main_menu.png', 'consumer_onboarding.png', 'consumer_settings.png',
            'consumer_trade.png', 'forest_echo_complete.png', 'quest_in_progress.png',
            'story_arc_active.png', 'storybook_event_danger.png', 'storybook_explore_dawn.png',
            'storybook_explore_night.png', 'storybook_explore_noon.png', 'storybook_intro.png',
            'village_progression.png'
          )
          $root = Join-Path $env:GITHUB_WORKSPACE 'tests\visual_qa'
          foreach ($name in $expected) {
            $path = Join-Path $root $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing visual QA evidence: $name" }
            $image = [System.Drawing.Image]::FromFile($path)
            try {
              if ($image.Width -ne 1280 -or $image.Height -ne 720) { throw "Visual QA image has invalid dimensions: $name ($($image.Width)x$($image.Height))" }
            } finally { $image.Dispose() }
          }
          Write-Output "Visual QA evidence: $($expected.Count) images at 1280x720"

      - name: Check repository whitespace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Repository whitespace check failed.' }

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-village-test-report
          path: |
            tests/simulation_test_report.json
            tests/security_audit_report.json
          if-no-files-found: warn
